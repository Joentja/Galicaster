;; Classroom profile: 2 video capture sources, each with its embedded
;; audio source (multistream bin: v4l2 video + audio of the same device)
[data]
name = Classroom

[track1]
name = Camera
device = multistream
flavor = presenter
location = /dev/video0
audiolocation = default
file = CAMERA.ts
caps = video/x-raw,framerate=30/1,width=1920,height=1080
videoencoder = x264enc pass=5 quantizer=22 speed-preset=4
muxer = mpegtsmux
volume = 1.0
amplification = 1.0
vumeter = True
player = True
active = True

[track2]
name = Screen
device = multistream
flavor = presentation
location = /dev/video2
audiolocation = default
file = SCREEN.ts
caps = video/x-raw,framerate=30/1,width=1280,height=720
videoencoder = x264enc pass=5 quantizer=22 speed-preset=4
muxer = mpegtsmux
volume = 1.0
amplification = 1.0
vumeter = True
player = True
active = True
